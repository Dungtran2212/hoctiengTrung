</style><style>.practice-bank{border:2px solid #c5a679;border-radius:13px;padding:15px 17px;margin:22px 0 12px;background:#f4e8cf}.practice-bank-title{font-size:22px;font-weight:800;color:#354f44;margin-bottom:12px}.practice-bank .bank{display:flex;flex-wrap:wrap;gap:12px;background:transparent;padding:0}.practice-bank .token{font-size:24px;padding:12px 17px;min-width:100px;border:1px solid #bba07a;background:#fffaf0;border-radius:9px}.practice-bank .token strong{color:#bc7742;margin-right:8px}.practice-rows .fillrow{font-size:23px;line-height:1.8;margin-bottom:9px}.practice-rows .blank{font-size:22px;min-width:110px}.practice-rows{margin-bottom:26px}@media(max-width:650px){.practice-bank .token{font-size:20px;min-width:72px}.practice-rows .fillrow{font-size:20px}}</style></head><body><div class="app"><header class="mast"><div class="eyebrow">新HSK教程 3.0 · 第一课 · 中文互动课堂</div><h1>我们去机场接你们</h1><p>Anh chị sẽ đến sân bay đón các em · Bài 1 · HSK 3</p></header><main class="wrap"><nav class="tabs" id="tabs" aria-label="Sáu trang bài học"></nav><div id="pages"></div></main></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Chi tiết từ vựng"><div class="modalbox" id="modalbody"></div></div><script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script><script>
const L=[{"title": "课文一", "sub": "在家里 · Ở nhà", "audio": 1, "wordAudio": 2, "words": [["以为", "yǐwéi", "đgt", "cho rằng, nghĩ rằng", "你以前以为老师是哪里人？", "我以前以为他是新同学，后来才知道他是老师的朋友。"], ["像", "xiàng", "đgt", "giống, giống như", "你觉得你长得像爸爸还是像妈妈？", "我的妹妹长得很像妈妈，但是她的眼睛更像爸爸。"], ["长", "cháng", "đgt", "phát triển, lớn lên", "你觉得小孩子长得快吗？", "我弟弟今年长得很快，现在已经比妈妈高了。"], ["身高", "shēngāo", "dt", "chiều cao", "你知道你爸爸的身高是多少吗？", "我哥哥的身高是一米八，他喜欢打篮球，也经常运动。"], ["米", "mǐ", "lượng", "mét (đơn vị đo lường)", "你们教室的门有两米高吗？", "我哥哥有一米八，他比我高很多，我们常常一起运动。"], ["瘦", "shòu", "tt", "gầy, ốm", "你觉得运动以后人会变瘦吗？", "我的朋友最近经常跑步，身体很好，看起来比以前瘦了一点儿。"]], "questions": [["刘明和王一雪在做什么？", ["看电视", "看手机", "去机场"], 1], ["刘明跟王一雪一起去机场做什么？", ["坐飞机", "找朋友", "接白家月"], 2]], "dialogue": ["刘明：这是杨同乐吗？他怎么跟白家月在一起？", "王一雪：他不是杨同乐，他叫李文，是白家月的好朋友。", "刘明：我还以为是同乐呢，他们看上去有点儿像。", "王一雪：是长得有点儿像，但是他比同乐高，身高有一米八。", "刘明：看起来他比同乐瘦一点儿。", "王一雪：下个星期家月和李文要来北京，我去机场接他们。", "刘明：他们哪天到北京？我要你一起去机场接他们吧。"], "speaking": ["你有没有认错过朋友？为什么？", "你会怎么描述一个人的外貌？"], "grammar": {"name": "看上去 / 看起来", "cn": "固定短语“看上去”和“看起来”可用来描述某人或某物的外观或状态，表达观察后得到的印象。", "vi": "Cụm từ cố định “看上去” và “看起来” dùng để miêu tả ngoại hình hoặc trạng thái của người hay sự vật theo ấn tượng quan sát được.", "formula": "主语 + 看上去 / 看起来 + 形容词 / 状态描述", "examples": ["他们看上去有点儿像。", "这些菜看起来都很好吃。", "那个新来的老师看上去很年轻。"], "exercise": ["你________长得更像你妈妈。", "你________，好好休息一下吧。", "你怎么了？今天________。"], "answer": ["看起来", "看起来很累", "看起来不太高兴"]}}, {"title": "课文二", "sub": "在机场 · Ở sân bay", "audio": 3, "wordAudio": 4, "words": [["接", "jiē", "đgt", "đón", "你去机场接朋友的时候，一般在哪里等他？", "明天下午我和哥哥去机场接从北京来的朋友。"], ["行李", "xíngli", "dt", "hành lý", "你出去旅游的时候，一般带多少行李？", "明天我要坐飞机去北京，所以今天晚上先把行李准备好了。"], ["丢", "diū", "đgt", "làm mất, bị mất", "你以前丢过手机或者书包吗？", "昨天我在学校丢了一本书，后来一个同学帮我找到了。"], ["箱子", "xiāngzi", "dt", "va li", "你喜欢用大箱子还是小箱子去旅游？", "这个箱子里有我的衣服和书，东西很多，所以有点儿重。"], ["号码", "hàomǎ", "dt", "số, mã số", "如果朋友换了电话号码，你会怎么知道？", "我把老师的电话号码写在本子上，找不到教室的时候可以给她打电话。"], ["好像", "hǎoxiàng", "phó", "dường như, có vẻ như", "你觉得今天好像要下雨了吗？", "我好像在学校见过那个学生，但是现在想不起来他的名字。"], ["重要", "zhòngyào", "tt", "quan trọng", "你觉得学习中文最重要的是什么？", "这本书对我很重要，所以我每天都把它带到学校。"], ["着急", "zháojí", "tt", "lo lắng, sốt ruột", "你找不到手机的时候会不会很着急？", "我在车站等了很长时间，朋友还没来，所以我有一点儿着急。"], ["护照", "hùzhào", "dt", "hộ chiếu", "你一般把护照放在哪儿，出门前会检查吗？", "明天我要坐飞机去北京，今天晚上我会把护照和机票放在书包里。"], ["服务台", "fúwùtái", "dt", "quầy phục vụ", "在机场找不到行李时，你会去服务台问什么？", "我在机场找不到自己的箱子，就去服务台请工作人员帮忙。"]], "questions": [["李文和白家月在机场做什么？", ["等箱子", "等同学", "等王一雪"], 0], ["白家月为什么很着急？", ["护照丢了", "行李箱丢了", "拿错行李箱了"], 1]], "dialogue": ["白家月：我的行李怎么还没出来？是不是丢了？", "李文：你的行李箱是什么样的？", "白家月：是一个黑色的箱子，上面写着我的名字和电话号码。", "李文：我好像在哪儿看到过这个箱子，是不是有人拿错了？", "白家月：我们快找谁问一下吧，箱子里有不少重要的东西。", "李文：别着急，我们拿着护照和机票，去服务台问问吧。"], "speaking": ["如果你的行李在机场丢了，你怎么办？", "你的行李箱是什么样的？"], "grammar": {"name": "疑问代词的非疑问用法（1）", "cn": "疑问代词“哪儿、什么、谁、哪”等用在陈述句中，表示不知道或不需要指明的地点、事物或人等。", "vi": "Các đại từ nghi vấn như “哪儿”, “什么”, “谁”, “哪” dùng trong câu trần thuật để biểu thị địa điểm, sự vật hoặc con người không biết hoặc không cần chỉ rõ.", "formula": "陈述句 + 疑问代词（谁 / 什么 / 哪儿 / 哪）+ 其他成分", "examples": ["我好像在哪儿看到过这个箱子。", "你吃点儿什么再走吧。", "我们哪天一起去踢足球吧。"], "exercise": ["A：我们是不是走错了？ B：我也不知道，我去______。（谁）", "A：你有时间了来我家，我______给你吃。（什么） B：好的，谢谢你。", "A：这几天太累了，我想______。（哪儿） B：那你去西安吧。"], "answer": ["找谁问问", "做点儿什么", "去哪儿玩玩"]}}, {"title": "课文三", "sub": "在机场大厅 · Sảnh sân bay", "audio": 5, "wordAudio": 6, "words": [["应该", "yīnggāi", "đtnn", "nên", "你觉得每天应该花多少时间学习中文？", "明天我们要考试，今天晚上应该早点儿回家，好好学习。"], ["站", "zhàn", "đgt", "đứng", "你等朋友的时候喜欢站在门口还是坐在里面？", "我们站在学校门口等老师，等她来了就一起去吃饭。"], ["中间", "zhōngjiān", "dt", "ở giữa, trung gian", "你上课的时候喜欢坐在前面还是中间？", "教室中间有一张大桌子，老师和学生常常坐在那里说话。"], ["短", "duǎn", "tt", "ngắn", "你喜欢穿长裤子还是短裤子？", "今天的天气很热，我穿了一条短裤子和一件白色的衣服。"], ["头发", "tóufa", "dt", "tóc", "你喜欢长头发还是短头发？为什么？", "我姐姐以前是长头发，现在头发短了一点儿，看起来很年轻。"], ["年轻", "niánqīng", "tt", "trẻ, trẻ tuổi", "你觉得照片里哪一个人看起来更年轻？", "王老师的姐姐已经工作很多年了，但是看起来还很年轻。"]], "questions": [["刘明和王一雪在机场做什么？", ["接人", "坐飞机", "找行李箱"], 0], ["刘明为什么要站到中间？", ["旁边人太多了", "他看见白家月了", "白家月好找他们"], 2]], "dialogue": ["刘明：飞机早就到了，你看见白家月他们了吗？", "王一雪：没有，他们应该快出来了。", "刘明：我们站到中间去吧，这样他们好找一些。", "王一雪：你看那个高个子的人是李文吗？", "刘明：你说的是哪个？那个穿着黑衣服的短头发的年轻人？", "王一雪：对，那个人就是李文。你看，家月在他后面呢。"], "speaking": ["你在机场接人时会站在哪里？", "你能描述一下李文的样子吗？"], "grammar": {"name": "多项定语 · Định ngữ đa tầng", "cn": "名词性中心语的前面可以同时有多个定语，这些定语一般按照时间、处所、动作/状态、特点的顺序进行排列，数量短语或指量短语位置比较灵活，可以放在表示动作或状态的定语的前面或者后面。", "vi": "Trước trung tâm ngữ danh từ có thể cùng xuất hiện nhiều định ngữ. Các định ngữ này thường được sắp xếp theo trật tự: thời gian/địa điểm → hành động/trạng thái → đặc điểm; trong đó, cụm từ chỉ số lượng hoặc cụm từ chỉ lượng có vị trí tương đối linh hoạt, có thể đặt trước hoặc sau định ngữ biểu thị hành động hoặc trạng thái.", "formula": "时间 / 处所 → 动作 / 状态 → 特点 → 中心语（数量短语或指量短语的位置较灵活）", "examples": ["李文是那个穿着黑衣服的短头发的年轻人吗？", "昨天和家月一起看电影的两个人是我的朋友。", "我那件新买的白色的衣服在哪儿？"], "exercise": ["那本______的书是我最喜欢的。", "A：哪个人是你男朋友？ B：______。", "A：你们上课的楼在哪儿？ B：在______的楼后面。"], "answer": ["昨天买", "那个穿着黑衣服的年轻人", "我们住"]}}, {"title": "课文四", "sub": "在宾馆房间 · Trong phòng khách sạn", "audio": 7, "wordAudio": 8, "words": [["发现", "fāxiàn", "đgt", "phát hiện, tìm thấy", "你发现自己忘带手机的时候会怎么办？", "我到了学校才发现今天没有带书，就给妈妈打了电话。"], ["不见", "bújiàn", "đtg", "bị mất, không thấy", "如果你的书包突然不见了，你会先去哪里找？", "我回到家发现手机不见了，后来在房间的桌子下面找到了。"], ["带", "dài", "đtg", "man, dẫn, đưa", "你出去旅游时最喜欢带什么东西？", "明天妈妈要带妹妹去看电影，我和爸爸准备在家做晚饭。"], ["帮助", "bāngzhù", "đtg", "giúp, giúp đỡ", "学习中文的时候，谁给过你很多帮助？", "我第一次去中国的时候，一个中国朋友帮助我找到了饭店。"], ["照片", "zhàopiàn", "dt", "ảnh(chụp)", "你最喜欢哪一张家人的照片？为什么？", "昨天我们在学校拍了很多照片，晚上我把照片发给了朋友。"]], "questions": [["李文回北京的路上花了多长时间？", ["几个小时", "十几个小时", "几十个小时"], 1], ["李文觉得王老师的姐姐看起来怎么样？", ["很累", "很年轻", "很像王老师"], 1]], "dialogue": ["李文：昨天我到北京了。虽然路上花了十几个小时，但是跟家月坐在一起，我觉得时间过得很快。", "李文：到机场的时候，家月发现行李箱不见了。", "李文：我带她去服务台，帮助她找到了行李箱。", "李文：走出机场的时候已经八点多了。我们一出来就看见了王老师的姐姐。", "李文：她看起来比照片上年轻。晚上，王老师的姐姐带我们去吃了很好吃的中国菜。"], "speaking": ["你有没有在旅行时丢过东西？", "谁帮助过你？你怎么感谢对方？"], "grammar": {"name": "一……就……", "cn": "“一……就……”表示前一动作发生后，后一动作马上发生。", "vi": "“一……就……” diễn tả hành động thứ hai xảy ra ngay sau hành động thứ nhất.", "formula": "主语 + 一 + 动词1 + 就 + 动词2", "examples": ["我们一出来就看见了王老师的姐姐。", "他一到家就给妈妈打电话。", "我一听就明白了。"], "exercise": ["我一到机场______给你打电话。", "他______看见我就笑了。", "妹妹一回家______开始做饭。"], "answer": ["就", "一", "就"]}}];

function speak(t){if(!('speechSynthesis' in window)){alert('Trình duyệt này không hỗ trợ đọc từ.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}
function audio(n){return `<audio controls preload="metadata" src="track-${n}.mp3">Trình duyệt không hỗ trợ audio.</audio>`}
function showTab(i){document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',j===i));document.querySelectorAll('.sheet').forEach((x,j)=>x.classList.toggle('active',j===i));window.scrollTo({top:0,behavior:'smooth'})}
function warm(){const words=['头发','照片','接人','身高','行李箱','护照'];const pin=['tóufa','zhàopiàn','jiērén','shēngāo','xínglixiāng','hùzhào'];const prompts=['她的头发长还是短？','这张照片里的人是谁？','你去机场接过朋友吗？','他的身高是多少？','你去机场的时候带几个行李箱？','出国旅行要带什么证件？'];return `<section class="sheet active"><div class="panel"><h2 class="ribbon orange">热身 · Khởi động</h2><div class="hero-grid"><div><h2>机场见！· Hẹn gặp ở sân bay</h2></div><div class="intro-visual">机场 ✈</div></div></div><div class="panel"><h2 class="ribbon">热身一 · 看图选词</h2><p>Quan sát hình và chọn từ tiếng Trung phù hợp với mỗi hình.</p><div class="warm-card-grid">${words.map((word,i)=>`<article class="warm-card"><img src="warmup-${i+1}.png" alt="Minh họa ${word}" loading="lazy"><div class="warm-letter">${'ABCDEF'[i]}</div><select class="warm-select" id="warmchoice${i}" aria-label="Chọn từ cho hình ${'ABCDEF'[i]}"><option value="">选择词语 / Chọn từ</option>${words.map((x,j)=>`<option value="${j}">${x} · ${pin[j]}</option>`).join('')}</select><p class="warm-prompt">${prompts[i]}</p><div id="warmresult${i}" class="warm-result" aria-live="polite"></div></article>`).join('')}</div><div class="warm-check"><button class="btn" onclick="checkWarmCards()">检查 · Kiểm tra</button><button class="btn ghost" onclick="resetWarmCards()">↻ Làm lại</button><span id="warmfb" role="status"></span></div></div><div class="panel"><h2 class="ribbon">热身二 · 说一说</h2><p>Hai người một nhóm, thực hành hội thoại theo tình huống thực tế.</p><div class="two"><div class="note">① 在机场，你的护照/机票/行李丢了，你会怎么办？<p class="muted">Ở sân bay, nếu bị mất hộ chiếu, vé máy bay hoặc hành lý, em sẽ làm gì?</p></div><div class="note">② 公司让你去机场接人，你没见过这个人，你会怎么做？<p class="muted">Công ty bảo em ra sân bay đón khách nhưng em chưa từng gặp người đó, em sẽ làm gì?</p></div></div></div></section>`}
function checkWarmCards(){let score=0;for(let i=0;i<6;i++){const sel=document.getElementById('warmchoice'+i),result=document.getElementById('warmresult'+i);const correct=sel.value===String(i);score+=Number(correct);sel.classList.toggle('warm-correct',correct);sel.classList.toggle('warm-incorrect',!correct);result.textContent=correct?'✓ Chính xác!':'✕ Chưa đúng, thử lại nhé';result.style.color=correct?'#36734e':'#b03232'}document.getElementById('warmfb').textContent=`${score}/6 câu đúng`}
function resetWarmCards(){for(let i=0;i<6;i++){const el=document.getElementById('warmchoice'+i);el.value='';el.classList.remove('warm-correct','warm-incorrect');document.getElementById('warmresult'+i).textContent=''}document.getElementById('warmfb').textContent=''}
function lessonThreeGrammar(){return `<div class="grammar grammar-single"><aside><b>Giải thích tiếng Việt</b><div class="grammar-steps"><div class="grammar-step">Trước trung tâm ngữ danh từ có thể cùng xuất hiện <span class="grammar-red">nhiều định ngữ</span>.</div><div class="grammar-step"><b>Trật tự thường gặp</b><p class="grammar-order">Thời gian / địa điểm → Hành động / trạng thái → Đặc điểm → Trung tâm ngữ (danh từ)</p></div><div class="grammar-step"><b>Lưu ý về vị trí</b><p><span class="grammar-red">Cụm từ chỉ số lượng hoặc cụm từ chỉ lượng</span> có vị trí tương đối linh hoạt: có thể đặt <span class="grammar-blue">trước hoặc sau</span> định ngữ biểu thị hành động / trạng thái.</p><div class="grammar-example"><p>① 我认识<span class="grammar-blue">两个</span>正在学中文的学生。</p><p class="translation">Tôi quen hai học sinh đang học tiếng Trung.</p><p>② 我认识正在学中文的<span class="grammar-blue">两个</span>学生。</p><p class="translation">Tôi quen hai học sinh đang học tiếng Trung.</p></div><p class="grammar-small">Ở cả hai câu, <span class="grammar-blue">两个</span> (hai + lượng từ 个) bổ nghĩa cho 学生, nhưng đứng ở hai vị trí khác nhau.</p></div><div class="grammar-step"><b>Ví dụ cụm chỉ số lượng / chỉ lượng</b><p><span class="grammar-red">一个</span> (một), <span class="grammar-red">两个</span> (hai), <span class="grammar-red">三本</span> (ba quyển), <span class="grammar-red">这几个</span> (mấy ... này).</p></div></div><b>例句 · Ví dụ trong sách</b>${L[2].grammar.examples.map(s=>`<p>• ${s} <button class="speaker" onclick='speak(${JSON.stringify(s)})'>🔊</button></p>`).join('')}</aside></div>`}
function lesson(i){let d=L[i];return `<section class="sheet"><div class="panel"><div class="topright"><div><h2 class="ribbon">${d.title} · ${d.sub}</h2></div><span class="pill">第${cnNums[i]}课文</span></div><h3 class="sectionhead">生词 · Từ mới</h3><div class="wordgrid">${d.words.map((w,j)=>`<button class="wordcard" onclick="openWord(${i},${j})"><div class="han">${w[0]}</div><div class="pin">${w[1]}</div><div class="tiny">${w[2]}</div><div class="meaning">${w[3]}</div><div class="tiny" style="margin-top:10px">🔊 2 ví dụ · nghe · luyện viết</div></button>`).join('')}</div><div class="line"></div><p>🔊 <b>Nghe danh sách từ mới (MP3 tài liệu)</b></p><div class="audio-row">${audio(d.wordAudio)}</div></div><div class="panel"><h2 class="ribbon orange">听课文 · Nghe bài khóa</h2><p>Nghe đoạn hội thoại rồi trả lời đúng cả hai câu hỏi để mở bài khóa.</p><div class="audio-row">${audio(d.audio)}</div><div class="quiz" id="quiz${i}">${d.questions.map((q,k)=>`<div class="question"><b>（${k+1}）${q[0]}</b><div class="choices">${q[1].map((a,j)=>`<button class="choice" id="c${i}-${k}-${j}" onclick="choose(${i},${k},${j})">${'ABC'[j]}. ${a}</button>`).join('')}</div></div>`).join('')}</div><p><button class="btn" onclick="checkQuiz(${i})">提交答案 · Kiểm tra đáp án</button></p><p id="quizfb${i}" class="feedback" role="status"></p><div id="unlocked${i}" class="hidden"><div class="line"></div><h3 class="sectionhead">课文 · Nội dung bài khóa</h3><div class="dialogue">${d.dialogue.map(s=>`<div class="bubble">${s} <button class="speaker" aria-label="Nghe câu" onclick='speak(${JSON.stringify(s)})'>🔊</button></div>`).join('')}</div><h3 class="sectionhead">说一说 · Luyện nói</h3>${d.speaking.map((s,j)=>`<div class="note" style="margin:9px 0">${j+1}. ${s} <button class="speaker" onclick='speak(${JSON.stringify(s)})'>🔊</button></div>`).join('')}</div></div><div class="panel"><h2 class="ribbon">小雨讲堂 · Lớp học của Tiểu Ngữ</h2><h3>${d.grammar.name}</h3>${i===2?lessonThreeGrammar():`<div class="grammar grammar-refined"><aside class="grammar-theory"><b>中文解释 · Giải thích tiếng Trung</b><p>${d.grammar.cn}</p><b>结构 · Cấu trúc</b><div class="grammar-formula">${d.grammar.formula}</div></aside><aside class="grammar-theory"><b>Giải thích tiếng Việt</b><p>${d.grammar.vi}</p><b>例句 · Ví dụ</b><div class="grammar-examples">${d.grammar.examples.map((s,k)=>`<div class="grammar-example-row"><span class="grammar-num">${String(k+1).padStart(2,'0')}</span><span class="grammar-sentence">${s}</span><button class="speaker" onclick='speak(${JSON.stringify(s)})'>🔊</button></div>`).join('')}</div></aside></div>`}<h3 class="sectionhead">完成句子 · Hoàn thành câu</h3>${d.grammar.exercise.map((s,j)=>`<div class="fillrow grammar-fill"><span class="fill-number">${j+1}.</span><div class="fill-content">${s.replace('______',`<input aria-label="Điền từ" id="g${i}-${j}" style="width:170px;padding:9px;border:1px solid #c9b18b;border-radius:6px">`).replace(/\s+B：/g,'<span class="dialogue-break">B：').replace(/(<span class="dialogue-break">B：[^<]*)$/, '$1</span>')}</div></div>`).join('')}<button class="btn" onclick="checkGrammar(${i})">检查 · Kiểm tra</button><p class="feedback" id="gfb${i}"></p></div></section>`}
const practiceWords=['带','接','丢','重要','应该','发现','以为','好像','年轻','帮助'];
const sentences=[
['服务台','在前面，我们过去问问吧。','应该'],
['他已经到了，我们快出去','他吧。','接'],
['我的护照不见了，是不是在机场','了？','丢'],
['行李票很','，你们出机场的时候有人看。','重要'],
['我','了两个行李箱和一个大包，所以走得非常慢。','带'],
['A：这个头发很短的男孩儿是我弟弟。<br>B：我','这个人是你，你们长得太像了。','以为'],
['A：我','坐飞机来北京的人非常多。<br>B：对，很多人这个时候来北京旅游。','发现'],
['A：这是我和哥哥的照片，你看我们像吗？<br>B：你们很像，你哥哥看起来也很','。','年轻'],
['A：你的行李箱找到了，你看看是不是这个？<br>B：对，太好了！谢谢您的','。','帮助'],
['A：那个穿着黑衣服的高个子的人是王老师吗？<br>B：','是吧，我也不知道。','好像']
];
function practiceBank(start){return `<div class="practice-bank"><div class="practice-bank-title">词语盒 · Hộp từ cần điền（${start===0?'1–5':'6–10'}）</div><div class="bank" id="bank${start}">${practiceWords.slice(start,start+5).map((w,k)=>`<button class="token" id="token${start+k}" draggable="true" ondragstart="dragFill(event,${start+k})" onclick="selectFill(${start+k})"><strong>${'ABCDE'[k]}</strong> ${w}</button>`).join('')}</div></div>`}
function practice(){return `<section class="sheet"><div class="panel"><h2 class="ribbon orange">综合练习 · Luyện tập tổng hợp</h2><p>Chọn hoặc kéo từ A–E trong từng khung xuống chỗ trống. Mỗi từ chỉ dùng một lần trong nhóm.</p>${[0,5].map(start=>`${practiceBank(start)}<div class="practice-rows">${sentences.slice(start,start+5).map((v,k)=>`<div class="fillrow">（${start+k+1}）${v[0]} <button class="blank" id="blank${start+k}" ondragover="event.preventDefault()" ondrop="dropFill(event,${start+k})" onclick="placeFill(${start+k})">________</button> ${v[1]}</div>`).join('')}</div>`).join('')}<button class="btn" onclick="checkFill()">检查答案 · Chấm bài</button> <button class="btn ghost" onclick="resetFill()">Làm lại</button><p class="feedback" id="fillfb"></p></div></section>`}
$('#tabs').innerHTML=tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="showTab(${i})">${t[0]}<small>${t[1]}</small></button>`).join('');$('#pages').innerHTML=warm()+L.map((d,i)=>lesson(i)).join('')+practice();
function chooseTerm(i){state.selectedTerm=i;document.querySelectorAll('.term').forEach((e,j)=>e.classList.toggle('selected',i===j))}function dragTerm(e,i){e.dataTransfer.setData('text/plain',String(i));chooseTerm(i)}function dropTerm(e,j){e.preventDefault();state.selectedTerm=Number(e.dataTransfer.getData('text/plain'));matchPhoto(j)}function matchPhoto(j){let i=state.selectedTerm;if(i===null)return;if(state.matched[i]!==undefined)return;if(i===j){state.matched[i]=j;$('#term'+i).classList.add('done');$('#photo'+j).classList.add('done');$('#matched'+j).textContent='✓ '+$('#term'+i).textContent.split(' ')[0];$('#warmfb').textContent='Đúng rồi! Đã nối '+Object.keys(state.matched).length+'/6';$('#warmfb').classList.add('ok')}else{$('#warmfb').textContent='Chưa đúng, thử lại nha!'}state.selectedTerm=null;document.querySelectorAll('.term').forEach(x=>x.classList.remove('selected'))}function resetWarm(){state.matched={};state.selectedTerm=null;document.querySelectorAll('.term,.photo').forEach(x=>x.classList.remove('selected','done'));document.querySelectorAll('[id^="matched"]').forEach(x=>x.textContent='');$('#warmfb').textContent='Đã nối: 0 / 6'}
function choose(i,k,j){state.chosen[`${i}-${k}`]=j;for(let n=0;n<3;n++)$('#c'+i+'-'+k+'-'+n).classList.toggle('chosen',n===j)}function checkQuiz(i){let ok=L[i].questions.every((q,k)=>state.chosen[`${i}-${k}`]===q[2]);let fb=$('#quizfb'+i);fb.textContent=ok?'✓ Chính xác! Bài khóa đã được mở.':'Chưa đúng cả 2 câu. Nghe lại và thử lần nữa nha!';fb.classList.toggle('ok',ok);$('#unlocked'+i).classList.toggle('hidden',!ok)}
function checkGrammar(i){if(i===1||i===2){let a=L[i].grammar.answer;let fb=$('#gfb'+i);fb.textContent='Đáp án tham khảo (có thể có cách trả lời khác đúng ngữ pháp): '+a.map((v,j)=>(j+1)+'. '+v).join(' / ');fb.classList.add('ok');return;}let a=L[i].grammar.answer;let correct=a.filter((v,j)=>$('#g'+i+'-'+j).value.trim()===v).length;let fb=$('#gfb'+i);fb.textContent=`${correct}/${a.length} câu đúng. `+(correct===a.length?'非常好！':'Đáp án tham khảo: '+a.join(' / '));fb.classList.toggle('ok',correct===a.length)}
function selectFill(i){state.fillSelected=i;document.querySelectorAll('.token').forEach((e,j)=>e.classList.toggle('selected',j===i))}function dragFill(e,i){e.dataTransfer.setData('text/plain',String(i));selectFill(i)}function dropFill(e,j){e.preventDefault();state.fillSelected=Number(e.dataTransfer.getData('text/plain'));placeFill(j)}function placeFill(j){let i=state.fillSelected;if(i===null)return;if(Math.floor(i/5)!==Math.floor(j/5)){alert('Hãy chọn từ A–E trong đúng nhóm câu này nhé!');return;}let prev=state.filled[j];if(prev!==undefined)$('#token'+prev).classList.remove('used');for(let k in state.filled){if(state.filled[k]===i){delete state.filled[k];$('#blank'+k).textContent='________'}}state.filled[j]=i;$('#blank'+j).textContent=practiceWords[i];$('#token'+i).classList.add('used');document.querySelectorAll('.token').forEach(x=>x.classList.remove('selected'));state.fillSelected=null}function checkFill(){let score=0;sentences.forEach((s,j)=>{let el=$('#blank'+j),good=practiceWords[state.filled[j]]===s[2];el.classList.toggle('good',good);el.classList.toggle('bad',!good);if(good)score++});$('#fillfb').textContent=`${score}/${sentences.length} câu đúng. `+(score===sentences.length?'太棒了！ Xuất sắc!':'Bà thử lại các câu màu đỏ nha!');$('#fillfb').classList.toggle('ok',score===sentences.length)}function resetFill(){state.filled={};state.fillSelected=null;document.querySelectorAll('.token').forEach(x=>x.classList.remove('used','selected'));document.querySelectorAll('.blank').forEach(x=>{x.textContent='________';x.classList.remove('good','bad')});$('#fillfb').textContent=''}
const CHAR_PINYIN={"以为": ["yǐ", "wéi"], "像": ["xiàng"], "长": ["cháng"], "身高": ["shēn", "gāo"], "米": ["mǐ"], "瘦": ["shòu"], "接": ["jiē"], "行李": ["xíng", "li"], "丢": ["diū"], "箱子": ["xiāng", "zi"], "号码": ["hào", "mǎ"], "好像": ["hǎo", "xiàng"], "重要": ["zhòng", "yào"], "着急": ["zháo", "jí"], "护照": ["hù", "zhào"], "服务台": ["fú", "wù", "tái"], "应该": ["yīng", "gāi"], "站": ["zhàn"], "中间": ["zhōng", "jiān"], "短": ["duǎn"], "头发": ["tóu", "fa"], "年轻": ["nián", "qīng"], "发现": ["fā", "xiàn"], "不见": ["bú", "jiàn"], "带": ["dài"], "帮助": ["bāng", "zhù"], "照片": ["zhào", "piàn"]};
const vocabHighlightTerms=[...new Set(L.flatMap(lesson=>lesson.words.map(w=>w[0])))].sort((a,b)=>b.length-a.length);
function highlightVocab(sentence){const pattern=new RegExp(vocabHighlightTerms.join('|'),'g');return esc(sentence).replace(pattern,match=>'<span class="vocab-highlight">'+match+'</span>')}
function openWord(i,j){let w=L[i].words[j];$('#modalbody').innerHTML=`<div class="modal-head"><h2>生词卡 · Thẻ từ vựng</h2><button class="btn ghost" onclick="closeWord()">✕ Đóng</button></div><div class="modalhan">${w[0]}</div><p class="pinyin-display" style="font-size:22px;color:#a34d39"><b>${w[1]}</b></p><p><b>词性 · Loại từ:</b> ${w[2]} &nbsp; | &nbsp; <b>越南语 · Nghĩa:</b> ${w[3]}</p><button class="btn" onclick='speak(${JSON.stringify(w[0])})'>🔊 Nghe phát âm từ</button><h3 class="sectionhead">例句 · Mẫu câu</h3><div class="note"><b>① 疑问句 · Câu hỏi</b><p class="examplecn">${highlightVocab(w[4])}</p><button class="speaker" onclick='speak(${JSON.stringify(w[4])})'>🔊 Nghe câu hỏi</button></div><div class="note" style="margin-top:12px"><b>② 陈述句 · Câu trần thuật</b><p class="examplecn">${highlightVocab(w[5])}</p><button class="speaker" onclick='speak(${JSON.stringify(w[5])})'>🔊 Nghe câu trần thuật</button></div><h3 class="sectionhead">写汉字 · Luyện viết chữ Hán theo bút thuận</h3><div class="hanzi-lab"><div class="hanzi-toolbar"><b>Chữ đang luyện:</b><select id="hanziSelect" onchange="selectHanzi(this.value)">${[...w[0]].map((c,k)=>`<option value="${k}">${c} · ${(CHAR_PINYIN[w[0]]||[])[k]||''}</option>`).join('')}</select><span id="hanziCurrent" class="hanzi-current">${[...w[0]][0]}</span></div><div class="hanzi-columns"><div class="hanzi-pane"><h4>👀 Xem mẫu</h4><div class="hanzi-square" id="hanziDemo"><div class="fallback-glyph">${[...w[0]][0]}</div></div><div class="hanzi-actions"><button class="hanzi-btn" onclick="animateHanzi()">▶ Xem viết</button><button class="hanzi-btn secondary" onclick="speak(currentHanzi)">🔊 Nghe</button></div></div><div class="hanzi-pane"><h4>✍️ Bạn viết</h4><div class="hanzi-square" id="hanziPractice"><div class="ghost-char">${[...w[0]][0]}</div><canvas id="hanziFreeCanvas" width="380" height="380"></canvas></div><div class="hanzi-actions"><button class="hanzi-btn secondary" onclick="resetHanziPractice()">↻ Viết lại</button></div></div></div><div id="hanziStatus" class="hanzi-status" role="status"></div></div>`;$('#modal').classList.add('show');initHanzi(w[0])}
function closeWord(){$('#modal').classList.remove('show')}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeWord()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWord()});let currentWord='',currentHanzi='',hanziDemoWriter=null,hanziQuizWriter=null,hanziDrawing=false,hanziFreeMode=true;
function initHanzi(word){currentWord=word;selectHanzi('0')}
function selectHanzi(index){const chars=Array.from(currentWord);currentHanzi=chars[Number(index)]||chars[0];$('#hanziCurrent').textContent=currentHanzi;$('#hanziSelect').value=String(index);hanziDemoWriter=null;hanziQuizWriter=null;hanziFreeMode=true;$('#hanziDemo').innerHTML='<div class="fallback-glyph">'+esc(currentHanzi)+'</div>';$('#hanziPractice').innerHTML='<div class="ghost-char">'+esc(currentHanzi)+'</div><canvas id="hanziFreeCanvas" width="380" height="380"></canvas>';$('#hanziStatus').textContent='';$('#hanziStatus').classList.remove('hanzi-error');setupFreeHanzi();if(window.HanziWriter){renderHanziGhost();const box=$('#hanziDemo');box.innerHTML='';const size=Math.min(380,Math.max(180,box.clientWidth));try{hanziDemoWriter=HanziWriter.create(box,currentHanzi,{width:size,height:size,padding:18,strokeColor:'#163d70',radicalColor:'#163d70',outlineColor:'#d3deeb',showOutline:true,showCharacter:true,strokeAnimationSpeed:1.1,delayBetweenStrokes:300,onLoadCharDataSuccess:()=>{startHanziQuiz()},onLoadCharDataError:()=>{$('#hanziStatus').textContent='Chưa tải được dữ liệu nét. Kiểm tra kết nối Internet.'}})}catch(e){box.innerHTML='<div class="fallback-glyph">'+esc(currentHanzi)+'</div>'}}else{$('#hanziStatus').textContent='Chưa tải được thư viện bút thuận. Hãy kết nối Internet để bật kiểm tra nét.'}}
function renderHanziGhost(){
 const box=$('#hanziPractice'),ghost=box.querySelector('.ghost-char');
 if(!ghost||!window.HanziWriter)return;
 ghost.textContent='';
 const size=Math.min(380,Math.max(180,box.clientWidth));
 try{HanziWriter.create(ghost,currentHanzi,{width:size,height:size,padding:18,strokeColor:'#c5d5e6',radicalColor:'#c5d5e6',showOutline:false,showCharacter:true});}
 catch(e){ghost.textContent=currentHanzi;}
}
function animateHanzi(){if(hanziDemoWriter){hanziDemoWriter.animateCharacter();$('#hanziStatus').textContent='Đang xem thứ tự nét của chữ '+currentHanzi}else{$('#hanziStatus').textContent='Cần kết nối Internet để xem hoạt ảnh bút thuận.'}}
function startHanziQuiz(){if(!window.HanziWriter){$('#hanziStatus').textContent='Cần Internet để kiểm tra bút thuận. Vui lòng kết nối mạng.';return}const box=$('#hanziPractice');box.innerHTML='';const size=Math.min(380,Math.max(180,box.clientWidth));try{hanziQuizWriter=HanziWriter.create(box,currentHanzi,{width:size,height:size,padding:18,showCharacter:false,showOutline:true,strokeColor:'#163d70',drawingColor:'#153d72',outlineColor:'#c5d5e6',highlightColor:'#163d70',onLoadCharDataError:()=>{$('#hanziStatus').textContent='Không tải được dữ liệu bút thuận. Hãy kiểm tra Internet.'}});hanziFreeMode=false;hanziQuizWriter.quiz({onMistake:()=>{const status=$('#hanziStatus'),square=$('#hanziPractice');status.textContent='❌ SAI NÉT / SAI THỨ TỰ! Nét vừa viết không đúng, hãy thử lại.';status.classList.add('hanzi-error');square.classList.remove('hanzi-error');void square.offsetWidth;square.classList.add('hanzi-error')},onCorrectStroke:()=>{$('#hanziStatus').classList.remove('hanzi-error');$('#hanziPractice').classList.remove('hanzi-error');$('#hanziStatus').textContent='✓ Đúng nét rồi! Tiếp tục nhé.'},onComplete:()=>{$('#hanziStatus').classList.remove('hanzi-error');$('#hanziPractice').classList.remove('hanzi-error');$('#hanziStatus').textContent='🎉 太棒了！ Bạn đã viết đúng thứ tự nét.'}});$('#hanziStatus').classList.remove('hanzi-error');$('#hanziStatus').textContent='Đang kiểm tra thứ tự nét: viết sai sẽ có cảnh báo đỏ.'}catch(e){resetHanziPractice();$('#hanziStatus').textContent='Chưa mở được chế độ kiểm tra nét.'}}
function resetHanziPractice(){const box=$('#hanziPractice');box.innerHTML='<div class="ghost-char">'+esc(currentHanzi)+'</div><canvas id="hanziFreeCanvas" width="380" height="380"></canvas>';hanziQuizWriter=null;hanziFreeMode=true;setupFreeHanzi();renderHanziGhost();$('#hanziStatus').classList.remove('hanzi-error');$('#hanziStatus').textContent='Đã xóa nét. Đang bật lại kiểm tra bút thuận.';if(window.HanziWriter)startHanziQuiz()}
function setupFreeHanzi(){const c=$('#hanziFreeCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.strokeStyle='#163d70';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{hanziDrawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pt(e))};c.onpointermove=e=>{if(!hanziDrawing)return;ctx.lineTo(...pt(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>{hanziDrawing=false}}
function clearCanvas(){resetHanziPractice()}

</script></body></html>
